<!--
  The menu bar icon: a dragon's head breathing fire, traced from a generated
  black-and-white drawing. macOS recolours it to suit the menu bar.

  The head and the fire are separate traced outlines; holes such as the eye are
  part of the same path (fill-rule="evenodd"). Gaps narrower than about 5 units
  on this 100×100 grid close up at menu bar size.

  The fire flickers: it is stretched and squashed from where it leaves the mouth,
  through the `values` below (width and height, 1 = as drawn). Open this file in a
  browser to watch it. The menu bar cannot play animations, so `npm run build:icon`
  renders one still frame per value, plays them while DesktopJarvis is working, and
  shows the drawing as it is when idle.
-->
