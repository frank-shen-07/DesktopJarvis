# Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0) builds the Mac app and
# publishes it as a GitHub Release. The build is ad-hoc signed, not notarised, so macOS
# will warn people who download it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test --if-present
      - run: npm run app
      - name: Zip the app
        run: ditto -c -k --keepParent release/mac-arm64/DesktopJarvis.app "DesktopJarvis-${GITHUB_REF_NAME}-mac-arm64.zip"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "DesktopJarvis-${GITHUB_REF_NAME}-mac-arm64.zip" --generate-notes --verify-tag
