name: Accessibility barrier
description: Something makes DesktopJarvis hard or impossible to use for you
labels: [accessibility]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. Accessibility barriers are treated as bugs.
        Please don't include real API keys, emails or calendar details.
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: What happened, and what would have worked better for you.
    validations:
      required: true
  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology or settings you use
      placeholder: VoiceOver, Voice Control, keyboard only, Reduce motion, Increase contrast...
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, M1 MacBook Air
