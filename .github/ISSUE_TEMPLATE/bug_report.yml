name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please don't include real API keys, tokens, emails or calendar details.
        Security problems go through the Security tab instead; see .github/SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you say or do, what did DesktopJarvis do, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Talk tab
        2. Say "What's on my calendar tomorrow?"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Listening (wake word, shortcut, speech to text)
        - Speaking (voice, cloning, free voice)
        - Thinking (Claude, Groq, local model, another agent)
        - Calendar or Reminders
        - Mail (Gmail, Outlook)
        - Files, apps, Word or web
        - Cards and the dragon
        - Settings or the window
        - Building or installing
        - Something else
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How were you running it?
      options:
        - Packaged app (npm run app)
        - Dev mode (npm run dev)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, M1 MacBook Air 8 GB
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Anything relevant from the terminal or the window's developer tools, with personal details removed.
      render: text
